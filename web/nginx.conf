server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/chat/stream -> http://backend:8000/chat/stream
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # send streamed replies to the browser as they arrive
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # built files have a hash in their name, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
