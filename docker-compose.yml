services:
  db:
    # Postgres with the pgvector extension included (for the vector DB later)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-llm_chat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 127.0.0.1 = reachable from this machine only, never from the internet;
    # set POSTGRES_PORT if 5432 is taken (e.g. by a locally installed Postgres)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-llm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-llm_chat}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # no "ports:" on purpose: the API is only reachable from the frontend
    # over the internal Docker network, never from the internet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # React UI, served at / (nginx inside also forwards /api/* to the backend)
  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # old Streamlit UI, still available at /streamlit/
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      BASE_URL_PATH: streamlit
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" serves plain HTTP; set DOMAIN in .env to a real hostname
      # (e.g. 13-201-5-7.sslip.io) and Caddy fetches an HTTPS cert for it
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  pgdata:
