services:
  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    # no "ports:" on purpose: the API is only reachable from the frontend
    # over the internal Docker network, never from the internet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" serves plain HTTP; set DOMAIN in .env to a real hostname
      # (e.g. 13-201-5-7.sslip.io) and Caddy fetches an HTTPS cert for it
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
